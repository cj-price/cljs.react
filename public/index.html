<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>cljs.react - Modern React for ClojureScript</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        corePlugins: { preflight: false },
        theme: { extend: { colors: { 'koi-orange': '#f97316' } } }
      }
    </script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e8ecf1 100%);
            background-image: radial-gradient(circle, #cbd5e1 1px, transparent 1px);
            background-size: 32px 32px;
            background-blend-mode: overlay;
            min-height: 100vh;
            line-height: 1.6;
            color: #374151;
            -webkit-font-smoothing: antialiased;
        }

        /* Utility classes */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Header */
        header {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb;
        }

        header .container {
            padding: 2rem 1rem;
            text-align: center;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 0.5rem;
        }

        h1 .accent {
            color: #f97316;
        }

        .subtitle {
            font-size: 1.125rem;
            color: #6b7280;
        }

        /* Navigation */
        nav {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid #e5e7eb;
        }

        nav .container {
            padding: 1rem;
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
        }

        /* Nav tab buttons (scoped — does not affect demo buttons) */
        nav button {
            padding: 0.625rem 1.25rem;
            border-radius: 0.5rem;
            font-weight: 500;
            font-size: 0.95rem;
            border: 1px solid #d1d5db;
            background: white;
            color: #374151;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        nav button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(249, 115, 22, 0.2);
        }

        nav button.active {
            background: #f97316;
            color: white;
            border-color: #f97316;
            box-shadow: 0 4px 6px -1px rgba(249, 115, 22, 0.3);
        }

        nav button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Strip browser defaults for in-demo buttons so Tailwind utilities take effect */
        main button {
            border: 0;
            background: transparent;
            font: inherit;
            cursor: pointer;
        }

        /* Main content */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        section {
            margin-bottom: 3rem;
        }

        h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #111827;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        /* Code and output cards */
        .glass {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 0.75rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        h4 {
            font-size: 1.125rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 1rem;
        }

        /* Orange dot indicator only on the demo-section title (above each code/output pair) */
        .code-and-output > h4 {
            display: flex;
            align-items: center;
        }

        .code-and-output > h4::before {
            content: '';
            width: 0.5rem;
            height: 0.5rem;
            background: #f97316;
            border-radius: 50%;
            margin-right: 0.5rem;
            flex-shrink: 0;
        }

        .code-and-output + .code-and-output {
            margin-top: 2rem;
        }

        .demo-columns {
            display: grid;
            grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
            gap: 1.25rem;
            align-items: stretch;
        }

        @media (max-width: 1024px) {
            .demo-columns {
                grid-template-columns: minmax(0, 1fr);
            }
        }

        @media (max-width: 640px) {
            h1 { font-size: 1.875rem; }
            h2 { font-size: 1.5rem; }
            main { padding: 1.25rem 0.75rem; }
            header .container { padding: 1.5rem 0.75rem; }
            pre { font-size: 0.78rem; padding: 1rem; }
        }

        /* Code blocks */
        pre {
            background: #1e293b;
            color: #e2e8f0;
            padding: 1.25rem;
            padding-top: 2rem;
            border-radius: 0.5rem;
            overflow-x: auto;
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
            font-size: 0.875rem;
            line-height: 1.7;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            position: relative;
            height: 100%;
        }

        pre::before {
            content: 'ClojureScript';
            position: absolute;
            top: 0.75rem;
            right: 1rem;
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 500;
        }

        /* Syntax highlighting */
        .token.comment { color: #64748b; }
        .token.keyword { color: #c678dd; font-weight: 600; }
        .token.string { color: #98c379; }
        .token.number { color: #d19a66; }
        .token.function { color: #61afef; }
        .token.punctuation { color: #abb2bf; }

        code {
            font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
        }

        /* Demo output */
        .demo-output {
            background: white;
            border: 2px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1.25rem;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 1rem;
        }

        .demo-output > * {
            min-width: 0;
        }

        /* Demo inputs: normalize browser defaults (preflight is off) so Tailwind utilities work */
        main input[type="text"],
        main input[type="email"],
        main input[type="password"],
        main input[type="number"],
        main input[type="search"],
        main select,
        main textarea {
            font: inherit;
            color: inherit;
            background: white;
            border-style: solid;
            outline: none;
        }

        main input[type="text"]:focus,
        main input[type="email"]:focus,
        main input[type="password"]:focus,
        main input[type="number"]:focus,
        main input[type="search"]:focus,
        main select:focus,
        main textarea:focus {
            outline: none;
        }

        /* JS-interop demo input: match the orange focus style used by CLJS inputs */
        main input.demo-js-input:focus {
            border-color: #f97316 !important;
            box-shadow: 0 0 0 2px rgba(249, 115, 22, 0.2);
        }

        /* Children-passing demo card (basics tab) */
        .demo-output .card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 0.5rem;
            padding: 1rem;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
        }

        .demo-output .card-title {
            font-size: 1rem;
            font-weight: 600;
            color: #111827;
            margin-bottom: 0.5rem;
            padding-bottom: 0.5rem;
            border-bottom: 1px solid #e5e7eb;
        }

        .demo-output .card-content p {
            font-size: 0.875rem;
            color: #4b5563;
            margin-bottom: 0.25rem;
        }

        .demo-output .card-content p:last-child {
            margin-bottom: 0;
        }

        /* Todo list */
        .todo-list {
            list-style: none;
            margin-top: 1rem;
        }

        .todo-list li {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.75rem;
            background: white;
            margin-bottom: 0.5rem;
            border-radius: 0.5rem;
            transition: all 0.2s ease;
        }

        .todo-list li:hover {
            transform: translateX(4px);
            background: #fef3c7;
        }

        .todo-list li.done span {
            text-decoration: line-through;
            opacity: 0.5;
        }

        /* Badges */
        .badge {
            display: inline-flex;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .badge-admin {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-user {
            background: #dbeafe;
            color: #1e40af;
        }

        .badge-moderator {
            background: #fef3c7;
            color: #92400e;
        }

        /* User cards */
        .user-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .user-card {
            background: white;
            padding: 1.25rem;
            border-radius: 0.5rem;
            border: 2px solid #e5e7eb;
            transition: all 0.2s ease;
        }

        .user-card:hover {
            border-color: #f97316;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.2);
        }

        /* Footer */
        footer {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-top: 1px solid #e5e7eb;
            margin-top: 4rem;
        }

        footer .container {
            padding: 2rem 1rem;
            text-align: center;
        }

        footer p {
            color: #6b7280;
            margin-bottom: 1rem;
        }

        footer strong {
            color: #f97316;
            font-weight: 600;
        }

        footer a {
            color: #6b7280;
            text-decoration: none;
            transition: color 0.2s ease;
        }

        footer a:hover {
            color: #f97316;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        ::-webkit-scrollbar-thumb {
            background: #f97316;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #ea580c;
        }
    </style>
</head>
<body>
    <div id="app"></div>
    <script src="js/main.js"></script>
</body>
</html>
